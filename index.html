<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>JLPT 단어장</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="level">JLPT</div>
    <div class="progress"></div>
    <div class="menu">
      <button onclick="toggleSidebar()">  메뉴  </button>
    </div>
  </header>

  <!-- 평소 보이지 않는 웹색 슬라이드 메뉴 -->
  <div id="sidebar">
    <div class="sidebar-header">
    </div>
    <ul>
      <li>JLPT N1</li>
      <li>JLPT N2</li>
      <li>JLPT N3</li>
      <li>JLPT N4</li>
      <li>JLPT N5</li>
    </ul>
  </div>

<!-- 카드 영역 -->
<div id="word-card" class="card">
    <div class="card-inner">
        <div class="card-front"> <!-- ✅ 한자 -->
          <div class="kanji"></div>
        </div>
        <div class="card-back"> <!-- ✅ 뜻 -->
          <div class="meaning"></div>
        </div>
      </div>
      
      

  <!-- 💡 버튼은 카드 아래에 같이 포함 -->
  <div class="buttons">
    <button id="unknown-button">모름</button>
    <button id="next-button">다음</button>
  </div>
</div>
<div id="overlay" onclick="toggleSidebar()"></div>
<div class="confetti-container"></div>
  <script src="script.js"></script>
</body>
</html>
